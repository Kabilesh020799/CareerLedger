name: Verify and release production

on:
  push:
    branches: [master]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/kabilesh020799/jobapplicationtracker-backend
  FRONTEND_IMAGE: ghcr.io/kabilesh020799/jobapplicationtracker-frontend

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  plan_release:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Read release version
        id: version
        run: echo "release_tag=$(node scripts/release-version.js)" >> "$GITHUB_OUTPUT"

      - name: Validate release changelog
        run: node scripts/release-notes.js >/dev/null

      - name: Check for an existing GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"

          case "$http_status" in
            200)
              echo "Release $RELEASE_TAG already exists; verification is complete and deployment will be skipped."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              set +e
              git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
              tag_status="$?"
              set -e

              case "$tag_status" in
                0)
                  echo "Tag $RELEASE_TAG already exists without a corresponding release." >&2
                  echo "Remove the unused tag or choose a new package version before releasing." >&2
                  exit 1
                  ;;
                2)
                  echo "Release $RELEASE_TAG is new and will be published."
                  echo "should_release=true" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "Unable to check whether tag $RELEASE_TAG exists." >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "GitHub release lookup failed with HTTP status $http_status." >&2
              sed -n '1,20p' "$response_file" >&2
              exit 1
              ;;
          esac

  publish:
    name: Publish ${{ matrix.service }} image
    needs: [verify, plan_release]
    if: needs.plan_release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            image: ghcr.io/kabilesh020799/jobapplicationtracker-backend
          - service: frontend
            context: ./frontend
            image: ghcr.io/kabilesh020799/jobapplicationtracker-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.plan_release.outputs.release_tag }}
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VITE_SENTRY_DSN=${{ vars.SENTRY_DSN }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
            VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ vars.SENTRY_REPLAYS_SESSION_SAMPLE_RATE || '0.1' }}

  deploy:
    name: Deploy and release production
    needs: [plan_release, publish]
    if: needs.plan_release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: write
      id-token: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Allow this runner to reach SSH
        if: vars.DEPLOY_METHOD != 'ssm'
        id: allow_ssh
        env:
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SECURITY_GROUP_ID: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
        run: |
          runner_ip="$(curl --fail --silent --show-error --retry 3 https://checkip.amazonaws.com)"
          case "$runner_ip" in
            *[!0-9.]*|""|.*|*.) echo "Unable to determine the runner IPv4 address." >&2; exit 1 ;;
          esac

          port="${DEPLOY_PORT:-22}"
          runner_cidr="$runner_ip/32"
          aws ec2 authorize-security-group-ingress \
            --group-id "$DEPLOY_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=$port,ToPort=$port,IpRanges=[{CidrIp=$runner_cidr}]"
          echo "runner_cidr=$runner_cidr" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: vars.DEPLOY_METHOD != 'ssm'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install deployment files
        if: vars.DEPLOY_METHOD != 'ssm'
        id: ssh_install
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -o ConnectTimeout=15 -o ConnectionAttempts=2 -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/job-application-tracker"
          scp -o ConnectTimeout=15 -o ConnectionAttempts=2 -i ~/.ssh/deploy_key -P "$port" deploy/compose.production.yml scripts/deploy-production.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/job-application-tracker/"
          ssh -o ConnectTimeout=15 -o ConnectionAttempts=2 -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 700 /opt/job-application-tracker/deploy-production.sh"

      - name: Configure application environment
        if: vars.DEPLOY_METHOD != 'ssm' && steps.ssh_install.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ALLOWED_ACCOUNT_EMAILS: ${{ vars.OPENAI_ALLOWED_ACCOUNT_EMAILS }}
          OPENAI_GMAIL_MODEL: ${{ vars.OPENAI_GMAIL_MODEL }}
          OPENAI_GMAIL_CONFIDENCE_THRESHOLD: ${{ vars.OPENAI_GMAIL_CONFIDENCE_THRESHOLD }}
          OPENAI_GMAIL_TIMEOUT_MS: ${{ vars.OPENAI_GMAIL_TIMEOUT_MS }}
          ADMIN_ACCOUNT_EMAILS: ${{ vars.ADMIN_ACCOUNT_EMAILS }}
          DEMO_USER_USERNAME: ${{ vars.DEMO_USER_USERNAME }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
          DEMO_USER_EMAIL: ${{ vars.DEMO_USER_EMAIL }}
          DEMO_USER_NAME: ${{ vars.DEMO_USER_NAME }}
          DEMO_USER_2_USERNAME: ${{ vars.DEMO_USER_2_USERNAME }}
          DEMO_USER_2_PASSWORD: ${{ secrets.DEMO_USER_2_PASSWORD }}
          DEMO_USER_2_EMAIL: ${{ vars.DEMO_USER_2_EMAIL }}
          DEMO_USER_2_NAME: ${{ vars.DEMO_USER_2_NAME }}
          RESUME_BUCKET: ${{ vars.RESUME_BUCKET }}
          APPLICATION_AWS_REGION: ${{ vars.AWS_REGION }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
        run: |
          case "$PRODUCTION_URL" in
            http://*)
              app_host="${PRODUCTION_URL#http://}"
              cookie_secure=false
              ;;
            https://*)
              app_host="${PRODUCTION_URL#https://}"
              cookie_secure=true
              ;;
            *) echo "PRODUCTION_URL must be an HTTP or HTTPS origin." >&2; exit 1 ;;
          esac

          app_host="${app_host%/}"
          case "$app_host" in
            ""|*/*) echo "PRODUCTION_URL must contain only an origin." >&2; exit 1 ;;
          esac

          case "$RESUME_BUCKET" in
            "") ;;
            *[!a-z0-9.-]*) echo "RESUME_BUCKET must be a valid S3 bucket name." >&2; exit 1 ;;
          esac
          case "$APPLICATION_AWS_REGION" in
            ""|*[!a-z0-9-]*) echo "AWS_REGION must be a valid AWS region." >&2; exit 1 ;;
          esac
          case "$OPENAI_ALLOWED_ACCOUNT_EMAILS" in
            *[!A-Za-z0-9@._,+-]*) echo "OPENAI_ALLOWED_ACCOUNT_EMAILS contains invalid characters." >&2; exit 1 ;;
          esac
          case "$ADMIN_ACCOUNT_EMAILS" in
            *[!A-Za-z0-9@._,+-]*) echo "ADMIN_ACCOUNT_EMAILS contains invalid characters." >&2; exit 1 ;;
          esac
          case "$DEMO_USER_USERNAME$DEMO_USER_2_USERNAME" in *[!A-Za-z0-9_-]*) echo "Demo usernames contain invalid characters." >&2; exit 1 ;; esac
          case "$DEMO_USER_EMAIL$DEMO_USER_2_EMAIL" in *[!A-Za-z0-9@._+-]*) echo "Demo emails contain invalid characters." >&2; exit 1 ;; esac
          case "$DEMO_USER_NAME$DEMO_USER_2_NAME" in *[!A-Za-z0-9._\ -]*) echo "Demo names contain invalid characters." >&2; exit 1 ;; esac
          case "$DEMO_USER_PASSWORD$DEMO_USER_2_PASSWORD" in *[!A-Za-z0-9@%+=:,._-]*) echo "Demo passwords contain invalid characters." >&2; exit 1 ;; esac

          port="${DEPLOY_PORT:-22}"
          {
            printf 'FRONTEND_URL=%s\n' "${PRODUCTION_URL%/}"
            printf 'COOKIE_SECURE=%s\n' "$cookie_secure"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_ALLOWED_ACCOUNT_EMAILS=%s\n' "$OPENAI_ALLOWED_ACCOUNT_EMAILS"
            printf 'OPENAI_GMAIL_MODEL=%s\n' "${OPENAI_GMAIL_MODEL:-gpt-5-nano}"
            printf 'OPENAI_GMAIL_CONFIDENCE_THRESHOLD=%s\n' "${OPENAI_GMAIL_CONFIDENCE_THRESHOLD:-80}"
            printf 'OPENAI_GMAIL_TIMEOUT_MS=%s\n' "${OPENAI_GMAIL_TIMEOUT_MS:-10000}"
            printf 'ADMIN_ACCOUNT_EMAILS=%s\n' "$ADMIN_ACCOUNT_EMAILS"
            printf 'DEMO_USER_USERNAME=%s\n' "$DEMO_USER_USERNAME"
            printf 'DEMO_USER_PASSWORD=%s\n' "$DEMO_USER_PASSWORD"
            printf 'DEMO_USER_EMAIL=%s\n' "$DEMO_USER_EMAIL"
            printf 'DEMO_USER_NAME=%s\n' "$DEMO_USER_NAME"
            printf 'DEMO_USER_2_USERNAME=%s\n' "$DEMO_USER_2_USERNAME"
            printf 'DEMO_USER_2_PASSWORD=%s\n' "$DEMO_USER_2_PASSWORD"
            printf 'DEMO_USER_2_EMAIL=%s\n' "$DEMO_USER_2_EMAIL"
            printf 'DEMO_USER_2_NAME=%s\n' "$DEMO_USER_2_NAME"
            printf 'GMAIL_CALLBACK_URL=%s/api/gmail/callback\n' "${PRODUCTION_URL%/}"
            printf 'AWS_REGION=%s\n' "$APPLICATION_AWS_REGION"
            printf 'RESUME_BUCKET=%s\n' "$RESUME_BUCKET"
            printf 'RESUME_UPLOAD_EXPIRES_SECONDS=300\n'
            printf 'VAPID_PUBLIC_KEY=%s\n' "$VAPID_PUBLIC_KEY"
            printf 'VAPID_PRIVATE_KEY=%s\n' "$VAPID_PRIVATE_KEY"
            printf 'VAPID_SUBJECT=%s\n' "$VAPID_SUBJECT"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
            printf 'SMTP_USER=%s\n' "$SMTP_USER"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'SMTP_FROM=%s\n' "$SMTP_FROM"
          } | ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; cat > /opt/job-application-tracker/.auth.env"

      - name: Authenticate instance to GHCR
        if: vars.DEPLOY_METHOD != 'ssm' && steps.ssh_install.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          port="${DEPLOY_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy immutable images
        if: vars.DEPLOY_METHOD != 'ssm' && steps.ssh_install.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "/opt/job-application-tracker/deploy-production.sh '${{ needs.plan_release.outputs.release_tag }}' '${{ github.sha }}'"

      - name: Store short-lived SSM deployment parameters
        if: vars.DEPLOY_METHOD == 'ssm' || steps.ssh_install.outcome == 'failure'
        id: ssm_parameters
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ALLOWED_ACCOUNT_EMAILS: ${{ vars.OPENAI_ALLOWED_ACCOUNT_EMAILS }}
          OPENAI_GMAIL_MODEL: ${{ vars.OPENAI_GMAIL_MODEL }}
          OPENAI_GMAIL_CONFIDENCE_THRESHOLD: ${{ vars.OPENAI_GMAIL_CONFIDENCE_THRESHOLD }}
          OPENAI_GMAIL_TIMEOUT_MS: ${{ vars.OPENAI_GMAIL_TIMEOUT_MS }}
          ADMIN_ACCOUNT_EMAILS: ${{ vars.ADMIN_ACCOUNT_EMAILS }}
          DEMO_USER_USERNAME: ${{ vars.DEMO_USER_USERNAME }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
          DEMO_USER_EMAIL: ${{ vars.DEMO_USER_EMAIL }}
          DEMO_USER_NAME: ${{ vars.DEMO_USER_NAME }}
          DEMO_USER_2_USERNAME: ${{ vars.DEMO_USER_2_USERNAME }}
          DEMO_USER_2_PASSWORD: ${{ secrets.DEMO_USER_2_PASSWORD }}
          DEMO_USER_2_EMAIL: ${{ vars.DEMO_USER_2_EMAIL }}
          DEMO_USER_2_NAME: ${{ vars.DEMO_USER_2_NAME }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RESUME_BUCKET: ${{ vars.RESUME_BUCKET }}
          PARAMETER_PREFIX: ${{ vars.DEPLOY_PARAMETER_PREFIX }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
        run: |
          case "$OPENAI_ALLOWED_ACCOUNT_EMAILS" in
            *[!A-Za-z0-9@._,+-]*) echo "OPENAI_ALLOWED_ACCOUNT_EMAILS contains invalid characters." >&2; exit 1 ;;
          esac
          case "$ADMIN_ACCOUNT_EMAILS" in
            *[!A-Za-z0-9@._,+-]*) echo "ADMIN_ACCOUNT_EMAILS contains invalid characters." >&2; exit 1 ;;
          esac
          case "$DEMO_USER_USERNAME$DEMO_USER_2_USERNAME" in *[!A-Za-z0-9_-]*) echo "Demo usernames contain invalid characters." >&2; exit 1 ;; esac
          case "$DEMO_USER_EMAIL$DEMO_USER_2_EMAIL" in *[!A-Za-z0-9@._+-]*) echo "Demo emails contain invalid characters." >&2; exit 1 ;; esac
          case "$DEMO_USER_NAME$DEMO_USER_2_NAME" in *[!A-Za-z0-9._\ -]*) echo "Demo names contain invalid characters." >&2; exit 1 ;; esac
          case "$DEMO_USER_PASSWORD$DEMO_USER_2_PASSWORD" in *[!A-Za-z0-9@%+=:,._-]*) echo "Demo passwords contain invalid characters." >&2; exit 1 ;; esac
          token_parameter="${PARAMETER_PREFIX}/${GITHUB_RUN_ID}/ghcr"
          auth_parameter="${PARAMETER_PREFIX}/${GITHUB_RUN_ID}/auth"
          auth_content="$(printf 'FRONTEND_URL=%s\nCOOKIE_SECURE=true\nGOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\nOPENAI_API_KEY=%s\nOPENAI_ALLOWED_ACCOUNT_EMAILS=%s\nOPENAI_GMAIL_MODEL=%s\nOPENAI_GMAIL_CONFIDENCE_THRESHOLD=%s\nOPENAI_GMAIL_TIMEOUT_MS=%s\nADMIN_ACCOUNT_EMAILS=%s\nDEMO_USER_USERNAME=%s\nDEMO_USER_PASSWORD=%s\nDEMO_USER_EMAIL=%s\nDEMO_USER_NAME=%s\nDEMO_USER_2_USERNAME=%s\nDEMO_USER_2_PASSWORD=%s\nDEMO_USER_2_EMAIL=%s\nDEMO_USER_2_NAME=%s\nGMAIL_CALLBACK_URL=%s/api/gmail/callback\nAWS_REGION=%s\nRESUME_BUCKET=%s\nRESUME_UPLOAD_EXPIRES_SECONDS=300\nVAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=%s\nSMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USER=%s\nSMTP_PASSWORD=%s\nSMTP_FROM=%s\n' \
            "${PRODUCTION_URL%/}" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" "$OPENAI_API_KEY" "$OPENAI_ALLOWED_ACCOUNT_EMAILS" "${OPENAI_GMAIL_MODEL:-gpt-5-nano}" "${OPENAI_GMAIL_CONFIDENCE_THRESHOLD:-80}" "${OPENAI_GMAIL_TIMEOUT_MS:-10000}" "$ADMIN_ACCOUNT_EMAILS" "$DEMO_USER_USERNAME" "$DEMO_USER_PASSWORD" "$DEMO_USER_EMAIL" "$DEMO_USER_NAME" "$DEMO_USER_2_USERNAME" "$DEMO_USER_2_PASSWORD" "$DEMO_USER_2_EMAIL" "$DEMO_USER_2_NAME" "${PRODUCTION_URL%/}" "${{ vars.AWS_REGION }}" "$RESUME_BUCKET" "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "$VAPID_SUBJECT" "$SMTP_HOST" "${SMTP_PORT:-587}" "$SMTP_USER" "$SMTP_PASSWORD" "$SMTP_FROM")"
          aws ssm put-parameter --name "$token_parameter" --type SecureString --value "$GHCR_TOKEN" --overwrite >/dev/null
          aws ssm put-parameter --name "$auth_parameter" --type SecureString --value "$auth_content" --overwrite >/dev/null
          echo "token_parameter=$token_parameter" >> "$GITHUB_OUTPUT"
          echo "auth_parameter=$auth_parameter" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable images through Systems Manager
        if: vars.DEPLOY_METHOD == 'ssm' || steps.ssh_install.outcome == 'failure'
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          TOKEN_PARAMETER: ${{ steps.ssm_parameters.outputs.token_parameter }}
          AUTH_PARAMETER: ${{ steps.ssm_parameters.outputs.auth_parameter }}
          RELEASE_TAG: ${{ needs.plan_release.outputs.release_tag }}
        run: |
          command="set -eu; app_dir=/opt/job-application-tracker; source_dir=/opt/job-application-tracker-source; install -d -m 700 \$app_dir; if [ ! -d \$source_dir/.git ]; then git clone '$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git' \$source_dir; fi; git -C \$source_dir fetch --depth=1 origin '$GITHUB_SHA'; git -C \$source_dir checkout --detach FETCH_HEAD; cp \$source_dir/deploy/compose.production.yml \$app_dir/compose.production.yml; cp \$source_dir/scripts/deploy-production.sh \$app_dir/deploy-production.sh; chmod 700 \$app_dir/deploy-production.sh; aws ssm get-parameter --name '$AUTH_PARAMETER' --with-decryption --query Parameter.Value --output text > \$app_dir/.auth.env; chmod 600 \$app_dir/.auth.env; aws ssm get-parameter --name '$TOKEN_PARAMETER' --with-decryption --query Parameter.Value --output text | docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin; \$app_dir/deploy-production.sh '$RELEASE_TAG' '$GITHUB_SHA'"
          jq -n --arg command "$command" '{commands: [$command]}' > ssm-parameters.json
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://ssm-parameters.json --query Command.CommandId --output text)"
          for attempt in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "SSM deployment timed out." >&2
          exit 1

      - name: Remove short-lived SSM deployment parameters
        if: always() && (vars.DEPLOY_METHOD == 'ssm' || steps.ssh_install.outcome == 'failure') && steps.ssm_parameters.outputs.token_parameter != ''
        env:
          TOKEN_PARAMETER: ${{ steps.ssm_parameters.outputs.token_parameter }}
          AUTH_PARAMETER: ${{ steps.ssm_parameters.outputs.auth_parameter }}
        run: aws ssm delete-parameters --names "$TOKEN_PARAMETER" "$AUTH_PARAMETER"

      - name: Publish successful GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan_release.outputs.release_tag }}
        run: |
          node scripts/release-notes.js > release-notes.md
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md

      - name: Remove this runner's SSH access
        if: always() && vars.DEPLOY_METHOD != 'ssm' && steps.allow_ssh.outputs.runner_cidr != ''
        env:
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SECURITY_GROUP_ID: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
          RUNNER_CIDR: ${{ steps.allow_ssh.outputs.runner_cidr }}
        run: |
          port="${DEPLOY_PORT:-22}"
          aws ec2 revoke-security-group-ingress \
            --group-id "$DEPLOY_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=$port,ToPort=$port,IpRanges=[{CidrIp=$RUNNER_CIDR}]"
