name: Dependabot guarded auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [master]

# This workflow never checks out or executes code from the pull request.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Enable guarded patch merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'master' &&
      github.repository == 'Kabilesh020799/CareerLedger'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Enable auto-merge for npm patch updates
        if: >-
          steps.dependabot-metadata.outputs.package-ecosystem == 'npm' &&
          (steps.dependabot-metadata.outputs.directory == '/backend' ||
          steps.dependabot-metadata.outputs.directory == '/frontend') &&
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
