name: Verify

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify release version
        run: |
          npm run test:release
          npm run release:version

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Verify deployment automation
        run: |
          sh -n scripts/deploy-production.sh
          sh scripts/deploy-production.test.sh
          cp deploy/.auth.env.production.example deploy/.auth.env
          docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yml config --quiet
          rm deploy/.auth.env
