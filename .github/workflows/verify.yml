name: Verify

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: |
          npm run test:release
          npm run release:version
          npm run release:notes >/dev/null

  dependency_audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  backend:
    name: Verify backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker_dev
          POSTGRES_DB: jobtracker_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        env:
          DATABASE_URL: postgresql://jobtracker:jobtracker_dev@127.0.0.1:5432/jobtracker_test
        run: |
          npm ci
          npm run db:generate
          npm test
          npm run typecheck:ci
          npm run build:ci

  frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  browser:
    name: Verify critical browser workflows (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker_dev
          POSTGRES_DB: jobtracker_test
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install application dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm run db:generate --prefix backend
      - name: Generate isolated browser-test credentials
        run: |
          echo "DEMO_USER_USERNAME=e2e_demo" >> "$GITHUB_ENV"
          echo "DEMO_USER_EMAIL=e2e-demo@example.invalid" >> "$GITHUB_ENV"
          echo "DEMO_USER_NAME=E2E Demo" >> "$GITHUB_ENV"
          echo "DEMO_USER_PASSWORD=Ci$(openssl rand -hex 24)Aa1" >> "$GITHUB_ENV"
      - name: Run critical workflows
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://jobtracker:jobtracker_dev@postgres:5432/jobtracker_test
          REDIS_URL: redis://redis:6379
          SESSION_SECRET: browser-test-session-secret-with-32-characters
          SEED_DEMO_DATA: "true"
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  deployment:
    name: Verify deployment automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: |
          sh -n scripts/deploy-production.sh
          sh scripts/deploy-production.test.sh
          cp deploy/.auth.env.production.example deploy/.auth.env
          docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yml config --quiet
          rm deploy/.auth.env
