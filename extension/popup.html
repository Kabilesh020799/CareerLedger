<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capture job</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">CL</div>
        <div>
          <p class="eyebrow">CareerLedger</p>
          <h1>Capture this role</h1>
        </div>
        <span id="connectionBadge" class="connection-badge">Not connected</span>
      </header>

      <details id="settingsPanel" class="settings-card">
        <summary>
          <span>Connection</span>
          <span class="summary-hint">API and access token</span>
        </summary>
        <section id="settings" class="settings-content">
          <label for="apiUrl">API URL</label>
          <input id="apiUrl" type="url" placeholder="http://localhost:3000/api" spellcheck="false">
          <label for="token">Extension token</label>
          <input id="token" type="password" autocomplete="off" placeholder="jat_ext_…" spellcheck="false">
        <p class="field-help">Create a capture token from the Extension page in CareerLedger.</p>
          <button id="saveSettings" class="secondary-button" type="button">Save connection</button>
        </section>
      </details>

      <section id="emptyState" class="empty-state">
        <div class="empty-icon" aria-hidden="true">↗</div>
        <h2>Ready to capture a job</h2>
        <p>Connect the extension, then open it on a job-posting page.</p>
      </section>

      <form id="captureForm" hidden>
        <div class="review-heading">
          <div>
            <p class="eyebrow">Review</p>
            <h2>Posting details</h2>
          </div>
          <button id="refreshPosting" class="text-button" type="button">Read page again</button>
        </div>

        <div class="field-grid">
          <label for="company">Company <span aria-hidden="true">*</span></label>
          <input id="company" required maxlength="200" autocomplete="organization">

          <label for="jobTitle">Job title <span aria-hidden="true">*</span></label>
          <input id="jobTitle" required maxlength="200" autocomplete="organization-title">

          <label for="location">Location</label>
          <input id="location" maxlength="200" autocomplete="address-level2">

          <label for="jobUrl">Original URL <span aria-hidden="true">*</span></label>
          <input id="jobUrl" type="url" required spellcheck="false">

          <label for="skills">Skills</label>
          <textarea id="skills" maxlength="5000" placeholder="TypeScript, React, PostgreSQL"></textarea>

          <label for="experienceRequirements">Experience requirements</label>
          <textarea id="experienceRequirements" maxlength="5000"></textarea>

          <div class="inline-fields">
            <div><label for="salaryMin">Salary minimum</label><input id="salaryMin" type="number" min="0" step="any"></div>
            <div><label for="salaryMax">Salary maximum</label><input id="salaryMax" type="number" min="0" step="any"></div>
          </div>

          <div class="inline-fields">
            <div><label for="salaryCurrency">Currency</label><input id="salaryCurrency" maxlength="3" placeholder="USD"></div>
            <div><label for="salaryPeriod">Salary period</label><select id="salaryPeriod"><option value="">Not provided</option><option>HOUR</option><option>DAY</option><option>WEEK</option><option>MONTH</option><option>YEAR</option></select></div>
          </div>

          <label for="workMode">Work mode</label>
          <select id="workMode"><option value="">Not provided</option><option value="REMOTE">Remote</option><option value="HYBRID">Hybrid</option><option value="ONSITE">On-site</option></select>

          <label for="jobDescription">Description <span aria-hidden="true">*</span></label>
          <textarea id="jobDescription" required maxlength="50000"></textarea>
        </div>

        <button id="capture" class="primary-button" type="submit">
          <span>Save application</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
