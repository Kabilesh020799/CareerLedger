<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capture job</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">JT</div>
        <div>
          <p class="eyebrow">Job Tracker</p>
          <h1>Capture this role</h1>
        </div>
        <span id="connectionBadge" class="connection-badge">Not connected</span>
      </header>

      <details id="settingsPanel" class="settings-card">
        <summary>
          <span>Connection</span>
          <span class="summary-hint">API and access token</span>
        </summary>
        <section id="settings" class="settings-content">
          <label for="apiUrl">API URL</label>
          <input id="apiUrl" type="url" placeholder="http://localhost:3000/api" spellcheck="false">
          <label for="token">Extension token</label>
          <input id="token" type="password" autocomplete="off" placeholder="jat_ext_…" spellcheck="false">
          <p class="field-help">Create a capture token from the Extension page in Job Tracker.</p>
          <button id="saveSettings" class="secondary-button" type="button">Save connection</button>
        </section>
      </details>

      <section id="emptyState" class="empty-state">
        <div class="empty-icon" aria-hidden="true">↗</div>
        <h2>Ready to capture a job</h2>
        <p>Connect the extension, then open it on a job-posting page.</p>
      </section>

      <form id="captureForm" hidden>
        <div class="review-heading">
          <div>
            <p class="eyebrow">Review</p>
            <h2>Posting details</h2>
          </div>
          <button id="refreshPosting" class="text-button" type="button">Read page again</button>
        </div>

        <div class="field-grid">
          <label for="company">Company <span aria-hidden="true">*</span></label>
          <input id="company" required maxlength="200" autocomplete="organization">

          <label for="jobTitle">Job title <span aria-hidden="true">*</span></label>
          <input id="jobTitle" required maxlength="200" autocomplete="organization-title">

          <label for="location">Location</label>
          <input id="location" maxlength="200" autocomplete="address-level2">

          <label for="jobUrl">Original URL <span aria-hidden="true">*</span></label>
          <input id="jobUrl" type="url" required spellcheck="false">

          <label for="jobDescription">Description <span aria-hidden="true">*</span></label>
          <textarea id="jobDescription" required maxlength="50000"></textarea>
        </div>

        <button id="capture" class="primary-button" type="submit">
          <span>Save application</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
