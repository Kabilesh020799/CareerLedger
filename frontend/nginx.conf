map $http_cloudfront_forwarded_proto $cloudfront_forwarded_proto {
  default $http_cloudfront_forwarded_proto;
  "" $scheme;
}

map $http_x_forwarded_proto $upstream_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $cloudfront_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 6m;

  error_page 413 = @resume_too_large;

  root /usr/share/nginx/html;
  index index.html;

  location @resume_too_large {
    default_type application/json;
    return 413 '{"error":"Resume must be 5 MB or smaller"}';
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Private Compose-network endpoint scraped by nginx-prometheus-exporter.
server {
  listen 8080;
  server_name _;

  location = /stub_status {
    stub_status;
    access_log off;
  }

  location / {
    return 404;
  }
}
