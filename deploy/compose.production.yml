name: job-application-tracker

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  backend:
    image: ghcr.io/kabilesh020799/jobapplicationtracker-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
      NODE_ENV: production
      APP_VERSION: ${IMAGE_TAG}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      SEED_DEMO_DATA: "false"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ENABLE_PASSWORD_LOGIN: "true"
      BOOTSTRAP_USER: "true"
      REDIS_URL: redis://redis:6379
    env_file:
      - .auth.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - internal

  gmail-worker:
    image: ghcr.io/kabilesh020799/jobapplicationtracker-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    command: npm run start:worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      APP_VERSION: ${IMAGE_TAG}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    env_file:
      - .auth.env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    image: ghcr.io/kabilesh020799/jobapplicationtracker-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
