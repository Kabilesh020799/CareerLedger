name: job-application-tracker

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  backend:
    image: ghcr.io/kabilesh020799/jobapplicationtracker-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
      NODE_ENV: production
      APP_ENV: production
      APP_VERSION: ${IMAGE_TAG}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      SERVICE_NAME: job-tracker-backend
      METRICS_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      SEED_DEMO_DATA: "false"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ENABLE_PASSWORD_LOGIN: "true"
      BOOTSTRAP_USER: "true"
      REDIS_URL: redis://redis:6379
    env_file:
      - .auth.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - internal

  gmail-worker:
    image: ghcr.io/kabilesh020799/jobapplicationtracker-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    command: npm run start:worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      APP_ENV: production
      APP_VERSION: ${IMAGE_TAG}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      SERVICE_NAME: job-tracker-worker
      METRICS_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      WORKER_METRICS_PORT: 9464
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    env_file:
      - .auth.env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    image: ghcr.io/kabilesh020799/jobapplicationtracker-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  postgres-exporter:
    profiles: ["observability"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.84.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  nginx-exporter:
    profiles: ["observability"]
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://frontend:8080/stub_status"]
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - internal

  node-exporter:
    profiles: ["observability"]
    image: quay.io/prometheus/node-exporter:v1.11.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal

  cadvisor:
    profiles: ["observability"]
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - internal

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
      - postgres-exporter
      - redis-exporter
      - nginx-exporter
      - node-exporter
      - cadvisor
    networks:
      - internal

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - internal

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
