groups:
  - name: job-tracker-availability
    rules:
      - alert: JobTrackerApiUnavailable
        expr: up{job="job-tracker-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Job Tracker API cannot be scraped
          description: Prometheus has been unable to reach the backend metrics endpoint for two minutes.
          action: Check backend container health, recent deployment logs, and internal network connectivity. Roll back the latest release if health checks also fail.

      - alert: JobTrackerHighServerErrorRate
        expr: |
          (
            sum(rate(job_tracker_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(job_tracker_http_requests_total[5m])), 0.001)
          ) > 0.05
          and sum(rate(job_tracker_http_requests_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of API requests are failing
          description: The backend server-error ratio has remained above 5% while receiving traffic.
          action: Inspect structured backend errors by route and correlation ID, then check PostgreSQL, Redis, and upstream provider health.

      - alert: JobTrackerElevatedLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(job_tracker_http_request_duration_seconds_bucket[10m]))
          ) > 1
          and sum(rate(job_tracker_http_requests_total[10m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeds one second
          description: User-facing request latency has remained elevated for fifteen minutes.
          action: Identify slow routes in Grafana, then inspect database saturation, Redis latency, and upstream calls before scaling or optimizing.

  - name: job-tracker-background-work
    rules:
      - alert: JobTrackerGmailQueueBacklog
        expr: job_tracker_queue_jobs{queue="gmail-sync",state="waiting"} > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Gmail synchronization queue is backing up
          description: More than 50 Gmail synchronization jobs have waited for at least fifteen minutes.
          action: Check gmail-worker health and Redis connectivity, then inspect retrying jobs and Google API quota errors.

      - alert: JobTrackerGmailSyncFailures
        expr: increase(job_tracker_background_jobs_total{worker="gmail-sync",outcome="failed"}[15m]) >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Repeated Gmail synchronization failures
          description: At least five Gmail synchronization attempts failed in the last fifteen minutes.
          action: Group worker errors by failure reason; verify Google credentials and quota, then retry transient jobs after resolving the cause.

      - alert: JobTrackerNotificationQueueBacklog
        expr: job_tracker_queue_jobs{queue="reminder-notifications",state="waiting"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Reminder notification queue is backing up
          description: More than 100 reminder delivery jobs have waited for at least fifteen minutes.
          action: Check worker and Redis health, then verify SMTP and Web Push providers before draining retries.

  - name: job-tracker-saturation
    rules:
      - alert: JobTrackerHighHeapUsage
        expr: process_resident_memory_bytes{job="job-tracker-backend"} > 536870912
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: Backend memory usage exceeds 512 MiB
          description: The backend process has remained above the expected memory envelope for twenty minutes.
          action: Compare memory growth with traffic and queue activity, collect a heap profile, and restart only after preserving diagnostic evidence.

      - alert: JobTrackerEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job="job-tracker-backend"} > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend event-loop lag is elevated
          description: The Node.js event loop p99 lag has exceeded 250 ms for ten minutes.
          action: Inspect CPU-heavy routes and synchronous work, compare against traffic, and capture a CPU profile before scaling.

  - name: job-tracker-infrastructure
    rules:
      - alert: JobTrackerInfrastructureExporterDown
        expr: up{job=~"postgres-exporter|redis-exporter|nginx-exporter|cadvisor|node-exporter"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Infrastructure telemetry is unavailable
          description: The {{ $labels.job }} target on {{ $labels.instance }} has been unreachable for ten minutes.
          action: Check the exporter container and its target service before trusting infrastructure dashboards or capacity alerts.

      - alert: JobTrackerHostDiskCritical
        expr: |
          (
            node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/boot.*"}
            /
            node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/boot.*"}
          ) < 0.10
          and predict_linear(node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/boot.*"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Host disk is critically low and projected to fill
          description: Filesystem {{ $labels.mountpoint }} has less than 10% free and is projected to exhaust within 24 hours.
          action: Identify container logs, images, or database growth; safely reclaim space or expand the volume before writes fail.

      - alert: JobTrackerHostMemoryCritical
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} < 0.05
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Host available memory is critically low
          description: Less than 5% of host memory has remained available for fifteen minutes.
          action: Find the growing container or process, preserve diagnostics, and scale or restart the responsible service before the host invokes the OOM killer.

      - alert: JobTrackerPostgresConnectionSaturation
        expr: sum(pg_stat_activity_count) / clamp_min(max(pg_settings_max_connections), 1) > 0.85
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL connections are nearing capacity
          description: More than 85% of configured PostgreSQL connections have been occupied for fifteen minutes.
          action: Inspect sessions by state and application, resolve leaked or long-running connections, then tune pool limits before raising the database limit.

      - alert: JobTrackerRedisEvictions
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Redis is evicting application data
          description: Redis evicted keys during the last fifteen minutes, which can disrupt queues and login throttling.
          action: Check maxmemory policy and queue retention, remove unintended memory growth, or increase Redis capacity before retrying affected jobs.

      - alert: JobTrackerRedisRejectedConnections
        expr: increase(redis_rejected_connections_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Redis is rejecting connections
          description: Redis rejected client connections during the last ten minutes.
          action: Check maxclients, blocked clients, connection leaks, and Redis availability; restore capacity before queues or login protection degrade.
