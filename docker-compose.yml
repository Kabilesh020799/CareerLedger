services:
  redis:
    image: redis:7-alpine
    container_name: job-tracker-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: job-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker_dev
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: job-tracker-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobtracker:jobtracker_dev@postgres:5432/jobtracker
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ALLOWED_ACCOUNT_EMAILS: ${OPENAI_ALLOWED_ACCOUNT_EMAILS:-}
      OPENAI_GMAIL_MODEL: ${OPENAI_GMAIL_MODEL:-gpt-5-mini}
      OPENAI_GMAIL_CONFIDENCE_THRESHOLD: ${OPENAI_GMAIL_CONFIDENCE_THRESHOLD:-80}
      OPENAI_GMAIL_TIMEOUT_MS: ${OPENAI_GMAIL_TIMEOUT_MS:-10000}
      ADMIN_ACCOUNT_EMAILS: ${ADMIN_ACCOUNT_EMAILS:-}
      GOOGLE_CALLBACK_URL: http://localhost:5173/api/auth/google/callback
      GMAIL_CALLBACK_URL: http://localhost:5173/api/gmail/callback
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-session-secret-change-me}
      COOKIE_SECURE: "false"
      ENABLE_PASSWORD_LOGIN: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_USER_USERNAME: ${DEMO_USER_USERNAME:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-}
      DEMO_USER_2_USERNAME: ${DEMO_USER_2_USERNAME:-}
      DEMO_USER_2_PASSWORD: ${DEMO_USER_2_PASSWORD:-}
      DEMO_USER_2_EMAIL: ${DEMO_USER_2_EMAIL:-}
      DEMO_USER_2_NAME: ${DEMO_USER_2_NAME:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      RESUME_BUCKET: ${RESUME_BUCKET:-}
      RESUME_UPLOAD_EXPIRES_SECONDS: ${RESUME_UPLOAD_EXPIRES_SECONDS:-300}
      REDIS_URL: redis://redis:6379
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  gmail-worker:
    build:
      context: ./backend
    container_name: job-tracker-gmail-worker
    restart: unless-stopped
    command: npm run start:worker
    environment:
      DATABASE_URL: postgresql://jobtracker:jobtracker_dev@postgres:5432/jobtracker
      NODE_ENV: development
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ALLOWED_ACCOUNT_EMAILS: ${OPENAI_ALLOWED_ACCOUNT_EMAILS:-}
      OPENAI_GMAIL_MODEL: ${OPENAI_GMAIL_MODEL:-gpt-5-mini}
      OPENAI_GMAIL_CONFIDENCE_THRESHOLD: ${OPENAI_GMAIL_CONFIDENCE_THRESHOLD:-80}
      OPENAI_GMAIL_TIMEOUT_MS: ${OPENAI_GMAIL_TIMEOUT_MS:-10000}
      GMAIL_CALLBACK_URL: http://localhost:5173/api/gmail/callback
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-session-secret-change-me}
      REDIS_URL: redis://redis:6379
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_ENABLE_PASSWORD_LOGIN: "true"
        VITE_ENABLE_GOOGLE_LOGIN: ${ENABLE_GOOGLE_LOGIN:-false}
        VITE_INSECURE_HTTP_DEPLOYMENT: "false"
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
        VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: ${VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE:-0.1}
    container_name: job-tracker-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
