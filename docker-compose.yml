services:
  redis:
    image: redis:7-alpine
    container_name: job-tracker-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: job-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker_dev
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: job-tracker-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobtracker:jobtracker_dev@postgres:5432/jobtracker
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: http://localhost:5173/api/auth/google/callback
      GMAIL_CALLBACK_URL: http://localhost:5173/api/gmail/callback
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-session-secret-change-me}
      COOKIE_SECURE: "false"
      ENABLE_PASSWORD_LOGIN: "true"
      SEED_DEMO_DATA: "true"
      DEMO_USER_USERNAME: demo
      DEMO_USER_PASSWORD: JobTrackerDemo123!
      AWS_REGION: ${AWS_REGION:-us-east-1}
      RESUME_BUCKET: ${RESUME_BUCKET:-}
      RESUME_UPLOAD_EXPIRES_SECONDS: ${RESUME_UPLOAD_EXPIRES_SECONDS:-300}
      REDIS_URL: redis://redis:6379
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  gmail-worker:
    build:
      context: ./backend
    container_name: job-tracker-gmail-worker
    restart: unless-stopped
    command: npm run start:worker
    environment:
      DATABASE_URL: postgresql://jobtracker:jobtracker_dev@postgres:5432/jobtracker
      NODE_ENV: development
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GMAIL_CALLBACK_URL: http://localhost:5173/api/gmail/callback
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-session-secret-change-me}
      REDIS_URL: redis://redis:6379
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_ENABLE_PASSWORD_LOGIN: "true"
        VITE_ENABLE_GOOGLE_LOGIN: ${ENABLE_GOOGLE_LOGIN:-false}
        VITE_INSECURE_HTTP_DEPLOYMENT: "false"
    container_name: job-tracker-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
